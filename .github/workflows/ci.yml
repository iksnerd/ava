name: CI

# Deliberately tag-only: this fires on a release tag and at no other time.
# Nothing runs on a pull request or on a push to main, so `make lint && make
# test` locally is the only pre-merge signal — see CONTRIBUTING.md, which says
# so rather than promising a green tick that will not appear.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Not cancel-in-progress: a tag build is a release check, and cancelling one
  # because another tag landed would leave the first release unverified.
  cancel-in-progress: false

jobs:
  # The Go code shells out to macOS tools but imports nothing platform-specific:
  # no cgo, no build tags, no *_darwin.go. Running it on Linux keeps that true —
  # every test stubs its subprocesses through testdata/bin or httptest.
  go:
    # Pinned, not -latest: a -latest label moves to a new OS on GitHub's
    # schedule (ubuntu-latest to 26 from 2026-10-19), and with CI only on tags
    # the first run on it would be a release. Bump these deliberately.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed for:"; echo "$unformatted"; exit 1
          fi

      - run: go vet ./...
      - run: go build ./...
      - run: go test -count=1 ./...
      - name: No hardcoded home directories
        run: bash scripts/check-portable-paths.sh

      # These stub the MLX surface (see mlx-engine/tests/conftest.py), so they
      # run here rather than on the macOS runner — which also proves the stubbing
      # holds on a machine where MLX could not be installed at all.
      - uses: astral-sh/setup-uv@v10.2.0
      - name: mlx-engine HTTP contract
        run: make test-mlx-engine
      - name: voxtral filter + device resolution
        run: make test-voxtral

  # Swift and the Python hooks. Xcode is preinstalled on the macOS runner, so
  # building the app needs no toolchain setup — only *running* it would need a
  # TCC grant, which a headless runner cannot give.
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: astral-sh/setup-uv@v10.2.0

      - run: go test -count=1 ./...

      - name: Build the menu bar app
        run: swift build --package-path AvaMenuBar

      - name: Config contract — Swift agrees with Go and bash
        run: make check-swift-config

      - name: voice-hooks tests
        working-directory: scripts/voice_hooks
        run: uv run --frozen pytest -q

      # Deliberately not `make lint`: that runs ruff through `uv run` inside
      # mlx-engine/, which resolves a 146-package lock including torch and the
      # CUDA stack. uvx gets the same linting without the multi-gigabyte sync.
      - name: Lint Python
        run: uvx ruff check mlx-engine/ voxtral/ scripts/voice_hooks/

  # Publishes the CLI binaries for a tag, and only for a tag: `if` guards
  # against workflow_dispatch, which has no tag to release. It waits on both
  # test jobs, because a release built from a tree that failed its own suite is
  # worse than no release.
  #
  # The release body is the newest CHANGELOG.md section, passed as
  # --release-notes; `mode: replace` in .goreleaser.yaml is what lets it land.
  #
  # The binaries are unsigned. macOS quarantines anything a browser downloads,
  # so a recipient clears it with `xattr -d com.apple.quarantine` — the release
  # footer says so. Signing
  # needs a Developer ID certificate this project does not have.
  release:
    needs: [go, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # GoReleaser derives the version from `git describe`, which needs the
          # tags and the history. A shallow clone would stamp every binary with
          # the fallback version instead.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Release notes from CHANGELOG.md
        # Refuse an empty file rather than publishing a release whose body is
        # just the footer, which is how v0.4.0 went out.
        run: |
          make release-notes > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "::error::release notes came out empty — check CHANGELOG.md's newest ## section"
            exit 1
          fi
          echo "release notes: $(wc -l < /tmp/release-notes.md) lines"


      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean --release-notes /tmp/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
