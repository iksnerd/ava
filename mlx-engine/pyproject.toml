[project]
name = "mlx-engine"
version = "0.1.0"
description = "Local STT+TTS HTTP server for local-whisper (Kokoro TTS, Voxtral STT) on Apple Silicon via MLX"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.135.3",
    "misaki[en]>=0.9.4",
    "mlx-audio[stt,tts]>=0.4.2",
    "python-multipart>=0.0.22",
    "uvicorn>=0.42.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.5",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"] # formatter governs code line length; long help/print strings are a judgment call

[tool.ruff.lint.per-file-ignores]
"server.py" = ["B008"] # FastAPI's File(...)/Depends(...) default-arg idiom
