# GoReleaser builds the two CLI binaries for a tagged release.
#
# Scope: the CLI only. The menu bar app is a Swift package that needs
# notarization before a .dmg is worth distributing, which is blocked on an
# Apple Developer Program membership (see TODO/issue #5).
#
# darwin/arm64 alone is deliberate. Cross-compilation is GoReleaser's usual
# selling point and it is moot here: the code shells out to afplay, pbcopy,
# osascript, say and sox, and the TTS engine is MLX, which has no Intel build.
# A linux binary would compile and then fail at the first thing it did.
#
# What a downloaded binary can do on its own: `local-whisper setup` installs
# sox, whisper-cli, the model and the Kokoro engine, which travels inside the
# binary (internal/enginedist). No checkout needed.
#
# What it cannot do: pass Gatekeeper unsigned. Signing for distribution needs a
# Developer ID Application certificate and notarization, both of which require
# a paid Apple Developer Program membership. An Xcode "Apple Development" cert
# is not a substitute — measured: it signs cleanly and `spctl -a -t exec` still
# rejects the result.
#
# That only bites a *browser* download, which is the one thing that attaches
# com.apple.quarantine. curl and gh do not, so scripts/install.sh never meets
# Gatekeeper at all. Worth knowing when it does bite, because there is nothing
# to search for: a quarantined unsigned binary run from a shell is killed with
# exit 137 and prints nothing, and the GUI dialog offers "Move to Trash" — not
# "Open". Clearing it afterwards is `xattr -d com.apple.quarantine`.
version: 2

project_name: local-whisper

before:
  hooks:
    - go mod tidy

builds:
  # The -X path must stay in step with the Makefile's LDFLAGS. It fails
  # silently if it stops resolving — the build succeeds and --version quietly
  # reports "dev" — so TestVersionStampingAgreesAcrossBuildSystems pins the two
  # together rather than trusting this comment.
  - id: local-whisper
    main: ./cmd/local-whisper
    binary: local-whisper
    env: [CGO_ENABLED=0]
    goos: [darwin]
    goarch: [arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w
      - -X github.com/iksnerd/local-whisper/internal/buildinfo.Version={{ .Summary }}

  - id: voice-monitor
    main: ./cmd/voice-monitor
    binary: voice-monitor
    env: [CGO_ENABLED=0]
    goos: [darwin]
    goarch: [arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w
      - -X github.com/iksnerd/local-whisper/internal/buildinfo.Version={{ .Summary }}

archives:
  - id: default
    ids: [local-whisper, voice-monitor]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - NOTICE
      - CHANGELOG.md
      # Nothing from scripts/ or mlx-engine/: the engine is embedded in the
      # binary, and shipping a second copy beside it is how the two drift.

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ .Summary }}"

changelog:
  # CHANGELOG.md is written by hand and is the release notes; a second
  # machine-generated list of commits beside it would contradict it within a
  # release. `make release-notes` extracts the top section for --release-notes.
  disable: true

release:
  # keep-existing so a release created by hand from CHANGELOG.md keeps its
  # notes and just gains the artifacts.
  mode: keep-existing
  prerelease: auto
  footer: |
    **Apple Silicon only.**

    ```bash
    bash <(gh api repos/iksnerd/local-whisper/contents/scripts/install.sh -q .content | base64 -d)
    local-whisper setup
    ```

    `install.sh` verifies the checksum and installs both binaries to
    `~/.local/bin`. `setup` then installs sox, whisper-cli, the speech model and
    the Kokoro TTS engine.

    **Prefer that over downloading these files in a browser.** These binaries
    are unsigned — signing for distribution needs a paid Apple Developer
    Program membership — and macOS attaches a quarantine flag to browser
    downloads but not to anything `curl` or `gh` fetches. A quarantined
    unsigned binary is killed with exit 137 and no message, and the dialog
    macOS shows offers **Move to Trash**, not Open. If you have already hit
    that: `xattr -d com.apple.quarantine local-whisper voice-monitor`.
