[project]
name = "voice-hooks"
version = "0.1.0"
description = "Text processing + local LLM summarization for Ava's Claude Code voice hooks"
requires-python = ">=3.11"
dependencies = [
    "pysbd>=0.3.4",
    "httpx>=0.28.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "ruff>=0.16.5",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"] # formatter governs code line length; long help strings are a judgment call
