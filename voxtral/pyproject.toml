[project]
name = "voxtral-primitives"
version = "0.1.0"
description = "Realtime STT primitives (Voxtral, Whisper, Sortformer diarization) for local-whisper's voice-monitor"
requires-python = ">=3.11"
dependencies = [
    "mlx-audio>=0.4.6",
    "sounddevice>=0.5.5",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.16.5",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"] # formatter governs code line length; long help strings are a judgment call
